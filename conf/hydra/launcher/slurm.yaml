_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
timeout_min: 1440
cpus_per_task: 1
tasks_per_node: 1
mem_per_cpu: 16384
nodes: 1
name: ${hydra.job.name}
array_parallelism: 256
max_num_timeout: 100
setup:
  - '#SBATCH --requeue'
  - 'module purge'
  - 'module load stack/2024-06'
  - 'module load gcc/12.2.0'
  - 'module load eth_proxy'
  - 'module load libx11/1.8.4-ns5x2da'
  - 'module load libxrandr/1.5.3-acspwjp'
  - 'module load libxinerama/1.1.3'
  - 'module load libxcursor/1.2.1'
  - 'module load libxi/1.7.6-qeazdpn'
  - 'module load mesa/23.0.3'
  - 'module load libxrender/0.9.10-kss2t7k'
  - 'module load libxext/1.3.3-e74gj2z'
  - 'module load libxfixes/5.0.2-5fbeidb'
  - 'module load python/3.10.13_cuda'
  - 'export MUJOCO_GL=egl'
  - 'export XLA_FLAGS=--xla_gpu_triton_gemm_any=true'
  - 'export WANDB_CACHE_DIR=/cluster/home/mwendl/wandb_cache'
  - 'export no_proxy=$(echo "$no_proxy" | sed "s/api.wandb.ai,//g; s/,api.wandb.ai//g; s/api.wandb.ai//g")'
  - 'source /cluster/home/mwendl/crl-identity/.venv/bin/activate'
